<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Agenda Builder | منشئ جدول الأعمال</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- html2pdf for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        secondary: '#0ea5e9', // Sky 500
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --font-en: 'Inter', sans-serif;
            --font-ar: 'Cairo', sans-serif;
        }

        body[dir="ltr"] { font-family: var(--font-en); }
        body[dir="rtl"] { font-family: var(--font-ar); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .sortable-ghost { opacity: 0.4; background-color: #f8fafc; border: 2px dashed #cbd5e1; }
        .sortable-drag { cursor: grabbing !important; }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            padding: 0;
            background: transparent;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #e2e8f0; border-radius: 6px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 selection:bg-primary selection:text-white transition-all duration-300 relative">

    <div id="app"></div>

    <!-- EXPORT OVERLAY (Fixes Blank PDF issue by physically rendering the DOM) -->
    <div id="export-overlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[9999] hidden flex-col items-center overflow-y-auto py-10">
        <!-- Loading Modal -->
        <div class="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center mb-8 sticky top-10 z-50">
            <i data-lucide="loader-2" class="w-12 h-12 text-primary animate-spin mb-4"></i>
            <h2 class="text-2xl font-bold text-slate-800" id="export-overlay-text">Generating PDF...</h2>
            <p class="text-slate-500 text-sm mt-2">Please wait while we format your document.</p>
        </div>
        <!-- Actual Render Container for HTML2PDF -->
        <div id="pdf-render-container" class="bg-white shadow-2xl shrink-0" style="width: 800px; min-height: 1000px;"></div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 end-4 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-50">
        <i data-lucide="info" class="w-5 h-5 text-secondary"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <script>
        // --- 1. Translations & Utilities ---
        const dict = {
            en: {
                appTitle: "Project Title",
                import: "Import",
                exportJson: "Export JSON",
                exportSyllabus: "Syllabus PDF",
                exportTimeline: "Timeline PDF",
                tabBuilder: "Agenda Builder",
                tabTimeline: "Timeline View",
                addDay: "Add Day",
                day: "Day",
                startTime: "Start Time",
                endTime: "End Time",
                autoAdjust: "Auto-adjust durations to fit End Time",
                addSession: "Add Session",
                addBreak: "Add Break",
                session: "Session",
                break: "Break",
                logistic: "Logistic",
                titlePlaceholder: "Session Title",
                descPlaceholder: "Add description...",
                duration: "Duration",
                color: "Color",
                to: "to",
                deleteConfirm: "Are you sure you want to delete this day?",
                imported: "Data imported successfully.",
                exported: "File exported.",
                dragDropEmpty: "Drag items here or add new ones"
            },
            ar: {
                appTitle: "عنوان المشروع",
                import: "استيراد",
                exportJson: "تصدير JSON",
                exportSyllabus: "PDF المنهج",
                exportTimeline: "PDF المخطط",
                tabBuilder: "باني الجدول",
                tabTimeline: "العرض الزمني",
                addDay: "إضافة يوم",
                day: "يوم",
                startTime: "وقت البدء",
                endTime: "وقت الانتهاء",
                autoAdjust: "ضبط المدة تلقائياً لتناسب وقت الانتهاء",
                addSession: "إضافة جلسة",
                addBreak: "إضافة استراحة",
                session: "جلسة",
                break: "استراحة",
                logistic: "لوجستي",
                titlePlaceholder: "عنوان الجلسة",
                descPlaceholder: "إضافة وصف...",
                duration: "المدة",
                color: "اللون",
                to: "إلى",
                deleteConfirm: "هل أنت متأكد من حذف هذا اليوم؟",
                imported: "تم استيراد البيانات بنجاح.",
                exported: "تم تصدير الملف.",
                dragDropEmpty: "اسحب العناصر هنا أو أضف عناصر جديدة"
            }
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);
        const t = (key) => dict[state.lang][key];

        const showToast = (message) => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        };

        const timeToMins = (time) => {
            if (!time) return 0;
            const [h, m] = time.split(':').map(Number);
            return (h * 60) + m;
        };

        const minsToTime = (mins) => {
            const h = Math.floor(mins / 60).toString().padStart(2, '0');
            const m = Math.floor(mins % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        };

        const defaultColors = { session: '#4f46e5', break: '#f59e0b', logistic: '#64748b' };

        // --- 2. State Management ---
        let state = {
            lang: 'en',
            tab: 'builder',
            title: "Executive Leadership Program",
            days: [
                {
                    id: generateId(), title: "Vision & Strategy", startTime: "09:00", endTime: "16:00", autoAdjust: false,
                    items: [
                        { id: generateId(), title: "Registration & Breakfast", type: "logistic", duration: 30, desc: "Welcome packets in lobby.", color: defaultColors.logistic },
                        { id: generateId(), title: "Opening Keynote", type: "session", duration: 90, desc: "Setting the stage for the week.", color: defaultColors.session },
                        { id: generateId(), title: "Coffee Break", type: "break", duration: 15, desc: "Networking.", color: defaultColors.break },
                        { id: generateId(), title: "Strategic Frameworks", type: "session", duration: 120, desc: "Interactive workshop breaking down Q3 targets.", color: defaultColors.session },
                        { id: generateId(), title: "Lunch", type: "break", duration: 60, desc: "Catered lunch.", color: defaultColors.break }
                    ]
                }
            ]
        };

        let sortableInstances = [];

        // --- 3. Core Logic (Time Calculation) ---
        const recalculateTimings = () => {
            state.days.forEach(day => {
                let startMins = timeToMins(day.startTime);
                let endMins = timeToMins(day.endTime);

                if (day.autoAdjust && startMins < endMins) {
                    const totalAvailableMins = endMins - startMins;
                    const fixedItems = day.items.filter(i => i.type !== 'session');
                    const flexItems = day.items.filter(i => i.type === 'session');
                    
                    const fixedMins = fixedItems.reduce((sum, i) => sum + (Number(i.duration) || 0), 0);
                    const remainingMins = Math.max(0, totalAvailableMins - fixedMins);
                    
                    const flexDuration = flexItems.length > 0 ? Math.floor(remainingMins / flexItems.length) : 0;
                    flexItems.forEach(i => i.duration = flexDuration);
                    if (flexItems.length > 0 && remainingMins % flexItems.length !== 0) {
                        flexItems[flexItems.length - 1].duration += (remainingMins % flexItems.length);
                    }
                }

                let currentMins = startMins;
                day.items.forEach(item => {
                    item._calculatedStart = minsToTime(currentMins);
                    currentMins += Number(item.duration) || 0;
                    item._calculatedEnd = minsToTime(currentMins);
                });

                if (!day.autoAdjust) day.endTime = minsToTime(currentMins);
                day._totalDuration = currentMins - startMins;
            });
        };

        // --- 4. Render Engine ---
        const toggleLang = () => {
            state.lang = state.lang === 'en' ? 'ar' : 'en';
            document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
            renderApp();
        };

        const renderApp = () => {
            recalculateTimings();
            const app = document.getElementById('app');
            app.innerHTML = `
                <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col xl:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-3 w-full xl:w-auto">
                            <div class="bg-primary p-2 rounded-lg text-white shrink-0 shadow-sm">
                                <i data-lucide="calendar-clock"></i>
                            </div>
                            <input type="text" id="project-title" value="${state.title}" class="text-xl md:text-2xl font-bold text-slate-800 bg-transparent border-b-2 border-transparent hover:border-slate-300 focus:border-primary focus:outline-none transition-colors w-full xl:w-80" placeholder="${t('appTitle')}">
                        </div>
                        
                        <div class="flex flex-wrap items-center gap-2 text-sm justify-center">
                            <button onclick="toggleLang()" class="px-3 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-md font-medium border border-slate-200">${state.lang === 'en' ? 'عربي' : 'English'}</button>
                            <input type="file" id="import-file" accept=".json" class="hidden" onchange="importJSON(event)">
                            <button onclick="document.getElementById('import-file').click()" class="flex items-center gap-2 px-3 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors border border-slate-200" title="${t('import')}">
                                <i data-lucide="upload" class="w-4 h-4"></i> <span class="hidden md:inline">${t('import')}</span>
                            </button>
                            <button onclick="exportJSON()" class="flex items-center gap-2 px-3 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors border border-slate-200" title="${t('exportJson')}">
                                <i data-lucide="download" class="w-4 h-4"></i> <span class="hidden md:inline">${t('exportJson')}</span>
                            </button>
                            <button onclick="exportSyllabusPDF()" id="btn-export-syllabus" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md shadow-sm transition-colors font-medium">
                                <i data-lucide="file-text" class="w-4 h-4"></i> <span>${t('exportSyllabus')}</span>
                            </button>
                            <button onclick="exportTimelinePDF()" id="btn-export-timeline" class="flex items-center gap-2 px-4 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-md shadow-sm transition-colors font-medium">
                                <i data-lucide="presentation" class="w-4 h-4"></i> <span>${t('exportTimeline')}</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-6 mt-2">
                        <button onclick="switchTab('builder')" class="py-3 px-1 border-b-2 font-medium text-sm transition-colors ${state.tab === 'builder' ? 'border-primary text-primary' : 'border-transparent text-slate-500 hover:text-slate-700'}">
                            <div class="flex items-center gap-2"><i data-lucide="layout-list" class="w-4 h-4"></i> ${t('tabBuilder')}</div>
                        </button>
                        <button onclick="switchTab('timeline')" class="py-3 px-1 border-b-2 font-medium text-sm transition-colors ${state.tab === 'timeline' ? 'border-primary text-primary' : 'border-transparent text-slate-500 hover:text-slate-700'}">
                            <div class="flex items-center gap-2"><i data-lucide="split-square-vertical" class="w-4 h-4"></i> ${t('tabTimeline')}</div>
                        </button>
                    </div>
                </header>

                <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                    ${state.tab === 'builder' ? renderBuilder() : renderTimelineScreen()}
                </main>
            `;
            lucide.createIcons();
            if (state.tab === 'builder') initSortables();
            attachInputListeners();
        };

        const switchTab = (tab) => {
            state.title = document.getElementById('project-title').value;
            state.tab = tab;
            renderApp();
        };

        const renderBuilder = () => {
            return `
                <div class="flex justify-end mb-6">
                    <button onclick="addDay()" class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-300 hover:border-primary hover:text-primary text-slate-700 rounded-md shadow-sm transition-colors font-medium">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> ${t('addDay')}
                    </button>
                </div>
                <div id="days-container" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6 items-start">
                    ${state.days.map((day, index) => renderDay(day, index)).join('')}
                </div>
            `;
        };

        const renderDay = (day, index) => {
            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full max-h-[85vh]">
                    <div class="bg-slate-50 p-4 border-b border-slate-200 sticky top-0 z-10">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="bg-primary/10 text-primary text-xs font-bold px-2 py-1 rounded whitespace-nowrap">${t('day')} ${index + 1}</span>
                                    <input type="text" class="font-bold text-lg text-slate-800 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-primary focus:outline-none w-full day-title-input" value="${day.title}" data-day-id="${day.id}">
                                </div>
                            </div>
                            <button class="text-slate-400 hover:text-red-500 p-1 ms-2 transition-colors" onclick="deleteDay('${day.id}')"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 bg-white p-3 rounded-lg border border-slate-200 mb-3 text-sm">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1 uppercase tracking-wider">${t('startTime')}</label>
                                <input type="time" class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary day-start-input" value="${day.startTime}" data-day-id="${day.id}">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1 uppercase tracking-wider">${t('endTime')} ${!day.autoAdjust ? '(Auto)' : ''}</label>
                                <input type="time" class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary day-end-input" value="${day.endTime}" data-day-id="${day.id}" ${!day.autoAdjust ? 'readonly disabled class="opacity-60"' : ''}>
                            </div>
                        </div>
                        
                        <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer p-1 hover:bg-slate-100 rounded transition-colors w-fit">
                            <input type="checkbox" class="rounded border-slate-300 text-primary focus:ring-primary day-auto-checkbox" data-day-id="${day.id}" ${day.autoAdjust ? 'checked' : ''}>
                            ${t('autoAdjust')}
                        </label>
                    </div>

                    <div class="p-4 flex-1 overflow-y-auto sortable-list" data-day-id="${day.id}">
                        ${day.items.length === 0 ? `<div class="p-8 text-center text-slate-400 text-sm border-2 border-dashed border-slate-200 rounded-lg">${t('dragDropEmpty')}</div>` : day.items.map(item => renderItem(day, item)).join('')}
                    </div>

                    <div class="p-4 border-t border-slate-100 bg-slate-50 flex gap-2">
                        <button onclick="addItem('${day.id}', 'session')" class="flex-1 flex justify-center items-center gap-1 py-2 bg-white border border-slate-200 hover:border-primary hover:text-primary rounded-md text-sm font-medium text-slate-600 transition-colors shadow-sm"><i data-lucide="plus" class="w-4 h-4"></i> ${t('addSession')}</button>
                        <button onclick="addItem('${day.id}', 'break')" class="flex-1 flex justify-center items-center gap-1 py-2 bg-white border border-slate-200 hover:border-amber-500 hover:text-amber-600 rounded-md text-sm font-medium text-slate-600 transition-colors shadow-sm"><i data-lucide="coffee" class="w-4 h-4"></i> ${t('addBreak')}</button>
                    </div>
                </div>
            `;
        };

        const renderItem = (day, item) => {
            const isAuto = day.autoAdjust && item.type === 'session';
            const currentColor = item.color || defaultColors[item.type];
            return `
                <div class="group relative bg-white border border-slate-200 rounded-lg shadow-sm hover:shadow-md transition-all mb-3 overflow-hidden border-s-4" style="border-inline-start-color: ${currentColor}" data-item-id="${item.id}">
                    <div class="p-3 flex items-start gap-2">
                        <div class="drag-handle mt-1 text-slate-300 hover:text-slate-500 p-1 shrink-0"><i data-lucide="grip-vertical" class="w-5 h-5"></i></div>
                        <div class="flex flex-col items-center justify-center min-w-[65px] mt-1 shrink-0 bg-slate-50 rounded py-1 px-2 border border-slate-100">
                            <span class="text-xs font-bold text-slate-700">${item._calculatedStart}</span>
                            <span class="text-[10px] text-slate-400 my-0.5">${t('to')}</span>
                            <span class="text-xs font-bold text-slate-600">${item._calculatedEnd}</span>
                        </div>
                        <div class="flex-1 min-w-0 ms-1">
                            <div class="flex flex-wrap items-center gap-2 mb-2">
                                <input type="text" class="font-bold text-slate-800 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-primary focus:outline-none flex-1 min-w-[120px] text-sm item-title-input" value="${item.title}" placeholder="${t('titlePlaceholder')}" data-day-id="${day.id}" data-item-id="${item.id}">
                                <div class="flex items-center gap-1.5 bg-slate-50 px-2 py-1 rounded border border-slate-200 shrink-0">
                                    <input type="color" value="${currentColor}" class="item-color-input w-5 h-5 rounded cursor-pointer shrink-0" data-day-id="${day.id}" data-item-id="${item.id}" title="${t('color')}">
                                    <div class="w-px h-4 bg-slate-300"></div>
                                    <select class="text-xs bg-transparent text-slate-600 focus:outline-none focus:text-primary item-type-select font-medium cursor-pointer" data-day-id="${day.id}" data-item-id="${item.id}">
                                        <option value="session" ${item.type === 'session' ? 'selected' : ''}>${t('session')}</option>
                                        <option value="break" ${item.type === 'break' ? 'selected' : ''}>${t('break')}</option>
                                        <option value="logistic" ${item.type === 'logistic' ? 'selected' : ''}>${t('logistic')}</option>
                                    </select>
                                </div>
                            </div>
                            <textarea class="text-xs text-slate-500 bg-transparent border border-transparent hover:border-slate-200 focus:border-primary rounded p-1 focus:outline-none w-full resize-none item-desc-input" rows="1" placeholder="${t('descPlaceholder')}" data-day-id="${day.id}" data-item-id="${item.id}">${item.desc || ''}</textarea>
                        </div>
                        <div class="flex flex-col items-end gap-2 shrink-0">
                            <div class="flex items-center bg-slate-50 border border-slate-200 rounded overflow-hidden ${isAuto ? 'opacity-60' : ''}" title="${isAuto ? 'Calculated automatically' : t('duration')}">
                                <input type="number" class="w-12 text-center py-1 text-xs font-semibold focus:outline-none focus:bg-white item-duration-input" value="${item.duration}" min="0" data-day-id="${day.id}" data-item-id="${item.id}" ${isAuto ? 'readonly tabindex="-1"' : ''}>
                                <span class="px-1.5 text-[10px] font-medium text-slate-500 bg-slate-100 border-s border-slate-200 py-1.5">m</span>
                            </div>
                            <button onclick="deleteItem('${day.id}', '${item.id}')" class="text-slate-300 hover:text-red-500 transition-colors p-1 rounded hover:bg-red-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderTimelineScreen = () => {
            const daysHTML = state.days.map((day, index) => {
                const totalMins = day._totalDuration > 0 ? day._totalDuration : 1;
                const barBlocks = day.items.map(item => {
                    const widthPercent = Math.max(0.5, (item.duration / totalMins) * 100);
                    return `<div class="h-full border-e border-white/30 last:border-0" style="width: ${widthPercent}%; background-color: ${item.color || defaultColors[item.type]};" title="${item.title}"></div>`;
                }).join('');

                const listItems = day.items.map((item, idx) => {
                    const color = item.color || defaultColors[item.type];
                    const isLast = idx === day.items.length - 1;
                    return `
                        <div class="relative flex items-stretch gap-4 mb-4 group">
                            <div class="relative flex flex-col items-center w-6 shrink-0">
                                <div class="w-4 h-4 rounded-full mt-2 z-10" style="background-color: ${color}; outline: 3px solid white; box-shadow: 0 0 0 4px ${color}20;"></div>
                                ${!isLast ? `<div class="w-0.5 bg-slate-200 absolute top-7 bottom-[-24px] z-0"></div>` : ''}
                            </div>
                            <div class="flex-1 bg-white border border-slate-100 rounded-lg p-4 shadow-sm hover:shadow-md transition-shadow">
                                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-2 mb-2">
                                    <h4 class="font-bold text-slate-800 text-lg break-words leading-tight">${item.title || t('session')}</h4>
                                    <span class="text-sm font-bold text-slate-600 bg-slate-50 border border-slate-100 px-3 py-1 rounded-md shrink-0 text-center" dir="ltr">
                                        ${item._calculatedStart} - ${item._calculatedEnd}<br>
                                        <span class="text-xs font-normal text-slate-400">(${item.duration}m)</span>
                                    </span>
                                </div>
                                ${item.desc ? `<p class="text-slate-500 text-sm whitespace-pre-wrap leading-relaxed">${item.desc}</p>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="mb-12">
                        <div class="flex flex-wrap items-center gap-3 border-b-2 border-slate-100 pb-4 mb-6">
                            <span class="bg-primary text-white px-3 py-1 rounded-md text-sm font-bold shadow-sm">${t('day')} ${index + 1}</span>
                            <h3 class="text-xl font-bold text-slate-800 break-words">${day.title}</h3>
                            <span class="text-sm font-semibold text-slate-400 ms-auto bg-slate-50 px-3 py-1 rounded-full border border-slate-200" dir="ltr">${day.startTime} - ${day.endTime}</span>
                        </div>
                        <div class="w-full h-5 sm:h-6 bg-slate-100 rounded-full overflow-hidden flex shadow-inner mb-8 border border-slate-200">
                            ${day.items.length > 0 ? barBlocks : `<div class="w-full h-full flex items-center justify-center text-slate-400 text-xs">...</div>`}
                        </div>
                        <div class="relative ms-1 sm:ms-2">${listItems}</div>
                    </div>
                `;
            }).join('');

            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sm:p-10 max-w-4xl mx-auto">
                    <div class="text-center mb-12 border-b-2 border-slate-100 pb-8">
                        <h2 class="text-3xl font-bold text-slate-800 mb-2 break-words">${state.title || t('appTitle')}</h2>
                        <p class="text-slate-500 flex items-center justify-center gap-2 font-medium"><i data-lucide="split-square-vertical" class="w-4 h-4"></i> ${t('tabTimeline')}</p>
                    </div>
                    <div>${daysHTML}</div>
                </div>
            `;
        };

        const initSortables = () => {
            sortableInstances.forEach(s => s.destroy()); sortableInstances = [];
            document.querySelectorAll('.sortable-list').forEach(listEl => {
                const sortable = Sortable.create(listEl, {
                    group: 'agenda-items', animation: 150, handle: '.drag-handle',
                    ghostClass: 'sortable-ghost', dragClass: 'sortable-drag',
                    onEnd: function (evt) {
                        const item = state.days.find(d => d.id === evt.from.dataset.dayId).items.splice(evt.oldIndex, 1)[0];
                        state.days.find(d => d.id === evt.to.dataset.dayId).items.splice(evt.newIndex, 0, item);
                        renderApp();
                    }
                });
                sortableInstances.push(sortable);
            });
        };

        const attachInputListeners = () => {
            if (state.tab !== 'builder') return;
            const container = document.getElementById('days-container');
            if(!container) return;

            container.addEventListener('input', (e) => {
                const target = e.target;
                const day = state.days.find(d => d.id === target.dataset.dayId);
                const item = target.dataset.itemId ? day.items.find(i => i.id === target.dataset.itemId) : null;
                if (target.classList.contains('day-title-input')) day.title = target.value;
                if (target.classList.contains('item-title-input')) item.title = target.value;
                if (target.classList.contains('item-desc-input')) {
                    item.desc = target.value; target.style.height = 'auto'; target.style.height = (target.scrollHeight) + 'px';
                }
            });

            container.addEventListener('change', (e) => {
                const target = e.target;
                const day = state.days.find(d => d.id === target.dataset.dayId);
                const item = target.dataset.itemId ? day.items.find(i => i.id === target.dataset.itemId) : null;
                let needsRender = false;
                if (target.classList.contains('day-start-input')) { day.startTime = target.value; needsRender = true; }
                if (target.classList.contains('day-end-input')) { day.endTime = target.value; needsRender = true; }
                if (target.classList.contains('day-auto-checkbox')) { day.autoAdjust = target.checked; needsRender = true; }
                if (item) {
                    if (target.classList.contains('item-duration-input')) { item.duration = parseInt(target.value) || 0; needsRender = true; }
                    if (target.classList.contains('item-color-input')) { item.color = target.value; needsRender = true; }
                    if (target.classList.contains('item-type-select')) { item.type = target.value; item.color = defaultColors[item.type]; needsRender = true; }
                }
                if(needsRender) renderApp();
            });
        };

        const addDay = () => { state.days.push({ id: generateId(), title: `${t('day')} ${state.days.length + 1}`, startTime: "09:00", endTime: "16:00", autoAdjust: false, items: [] }); renderApp(); };
        const deleteDay = (id) => { if(confirm(t('deleteConfirm'))) { state.days = state.days.filter(d => d.id !== id); renderApp(); } };
        const addItem = (dayId, type) => { state.days.find(d => d.id === dayId).items.push({ id: generateId(), title: type === 'session' ? t('session') : t('break'), type: type, duration: type === 'session' ? 60 : 15, desc: "", color: defaultColors[type] }); renderApp(); };
        const deleteItem = (dayId, itemId) => { const day = state.days.find(d => d.id === dayId); day.items = day.items.filter(i => i.id !== itemId); renderApp(); };

        const exportJSON = () => {
            state.title = document.getElementById('project-title').value;
            const dataStr = JSON.stringify(state, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `Agenda_${state.title.replace(/\s+/g, '_')}.json`; a.click();
            URL.revokeObjectURL(url); showToast(t('exported'));
        };
        const importJSON = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try { const data = JSON.parse(event.target.result); if(data.days) { state = data; renderApp(); showToast(t('imported')); } } 
                catch (err) { alert("Invalid JSON"); }
            };
            reader.readAsText(file); e.target.value = '';
        };

        // --- 7. PERFECT PDF EXPORT ENGINE ---
        
        const executePDFExport = (htmlContent, filename) => {
            const overlay = document.getElementById('export-overlay');
            const container = document.getElementById('pdf-render-container');
            
            // 1. Inject HTML into the container that is part of the DOM
            container.innerHTML = htmlContent;
            
            // 2. Show the overlay so it becomes visible to the browser engine
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            // 3. Wait slightly for browser to paint fonts and styles physically on screen
            setTimeout(() => {
                const opt = {
                    margin: 0, 
                    filename: filename,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                };
                
                // 4. Capture the container
                html2pdf().set(opt).from(container).save().then(() => {
                    // 5. Hide & Cleanup
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    container.innerHTML = '';
                }).catch(err => {
                    console.error("PDF generation error: ", err);
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    alert("Error generating PDF. See console.");
                });
            }, 600); // 600ms gives plenty of time for rendering
        };

        const getPDFInlineStyles = () => `
            font-family: ${state.lang === 'ar' ? "'Cairo', sans-serif" : "'Inter', sans-serif"}; 
            direction: ${state.lang === 'ar' ? 'rtl' : 'ltr'}; 
            color: #1e293b; 
            padding: 40px; 
            background: #ffffff;
            line-height: 1.5;
            box-sizing: border-box;
            width: 800px;
        `;

        const exportSyllabusPDF = () => {
            recalculateTimings();
            state.title = document.getElementById('project-title').value;
            const filename = `Syllabus_${state.title.replace(/\s+/g, '_')}.pdf`;
            
            let html = `
                <div style="${getPDFInlineStyles()}">
                    <div style="text-align: center; margin-bottom: 40px; border-bottom: 2px solid #4f46e5; padding-bottom: 20px;">
                        <h1 style="color: #0f172a; margin: 0 0 10px 0; font-size: 28px; font-weight: bold;">${state.title || t('appTitle')}</h1>
                        <p style="color: #64748b; margin: 0; font-size: 16px;">Syllabus</p>
                    </div>
            `;

            state.days.forEach((day, index) => {
                html += `
                    <div style="margin-bottom: 40px; page-break-inside: avoid;">
                        <div style="border-bottom: 2px solid #cbd5e1; padding-bottom: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                            <h2 style="color: #4f46e5; margin: 0; font-size: 20px; font-weight: bold;">${t('day')} ${index + 1}: ${day.title}</h2>
                            <span style="font-size: 14px; color: #64748b; direction: ltr; display: inline-block;">${day.startTime} - ${day.endTime}</span>
                        </div>
                        <table style="width: 100%; border-collapse: collapse; font-size: 14px; text-align: ${state.lang === 'ar' ? 'right' : 'left'};">
                            <thead>
                                <tr style="background-color: #f8fafc;">
                                    <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; width: 120px; color:#475569; font-weight: bold;">${t('startTime')}</th>
                                    <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; color:#475569; font-weight: bold;">Details</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                day.items.forEach(item => {
                    const color = item.color || defaultColors[item.type];
                    const bg = item.type === 'break' ? '#fef9c3' : '#ffffff';
                    const borderSide = state.lang === 'ar' ? 'border-right' : 'border-left';
                    html += `
                        <tr style="background-color: ${bg}; border-bottom: 1px solid #e2e8f0; page-break-inside: avoid;">
                            <td style="padding: 12px; vertical-align: top; white-space: nowrap; ${borderSide}: 4px solid ${color};">
                                <strong style="color: #334155; font-size: 15px;">${item._calculatedStart}</strong><br>
                                <span style="color: #64748b; font-size: 12px;">${item.duration}m</span>
                            </td>
                            <td style="padding: 12px; vertical-align: top;">
                                <div style="font-weight: bold; color: #0f172a; margin-bottom: 4px; font-size: 16px; word-break: break-word;">${item.title || 'Untitled'}</div>
                                ${item.desc ? `<div style="color: #475569; white-space: pre-wrap; word-break: break-word;">${item.desc}</div>` : ''}
                            </td>
                        </tr>
                    `;
                });
                html += `</tbody></table></div>`;
            });
            html += `</div>`;
            
            executePDFExport(html, filename);
        };

        const exportTimelinePDF = () => {
            recalculateTimings();
            state.title = document.getElementById('project-title').value;
            const filename = `Timeline_${state.title.replace(/\s+/g, '_')}.pdf`;

            let html = `
                <div style="${getPDFInlineStyles()}">
                    <div style="text-align: center; margin-bottom: 40px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px;">
                        <h1 style="color: #0f172a; margin: 0 0 10px 0; font-size: 28px; font-weight: bold;">${state.title || t('appTitle')}</h1>
                        <p style="color: #64748b; margin: 0; font-size: 16px;">Timeline View</p>
                    </div>
            `;

            state.days.forEach((day, index) => {
                const totalMins = day._totalDuration > 0 ? day._totalDuration : 1;
                
                html += `
                    <div style="margin-bottom: 40px; page-break-inside: avoid;">
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 20px;">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <span style="background-color: #4f46e5; color: white; padding: 4px 12px; border-radius: 6px; font-size: 14px; font-weight: bold;">${t('day')} ${index + 1}</span>
                                <h3 style="margin: 0; font-size: 20px; font-weight: bold; color: #0f172a; word-break: break-word;">${day.title}</h3>
                            </div>
                            <span style="font-size: 14px; color: #64748b; border: 1px solid #e2e8f0; padding: 4px 12px; border-radius: 20px; background-color: #f8fafc; direction: ltr; display: inline-block;">${day.startTime} - ${day.endTime}</span>
                        </div>
                `;

                let blocks = '';
                day.items.forEach(item => {
                    const widthPercent = Math.max(0.5, (item.duration / totalMins) * 100);
                    const color = item.color || defaultColors[item.type];
                    const borderSide = state.lang === 'ar' ? 'border-left' : 'border-right';
                    blocks += `<div style="width: ${widthPercent}%; height: 100%; background-color: ${color}; box-sizing: border-box; ${borderSide}: 1px solid rgba(255,255,255,0.3);"></div>`;
                });
                
                html += `
                        <div style="width: 100%; height: 24px; background-color: #f1f5f9; border-radius: 12px; display: flex; overflow: hidden; margin-bottom: 24px; border: 1px solid #e2e8f0;">
                            ${day.items.length > 0 ? blocks : ''}
                        </div>
                `;

                const isAr = state.lang === 'ar';
                day.items.forEach((item, idx) => {
                    const color = item.color || defaultColors[item.type];
                    const isLast = idx === day.items.length - 1;
                    const flexDir = isAr ? 'row-reverse' : 'row';
                    const nodeMargin = isAr ? 'margin-left: 16px;' : 'margin-right: 16px;';

                    html += `
                        <div style="display: flex; align-items: stretch; margin-bottom: 16px; page-break-inside: avoid; flex-direction: ${flexDir};">
                            <div style="width: 24px; display: flex; flex-direction: column; align-items: center; position: relative; flex-shrink: 0; ${nodeMargin}">
                                <div style="width: 16px; height: 16px; border-radius: 50%; background-color: ${color}; border: 3px solid white; box-shadow: 0 0 0 2px #e2e8f0; margin-top: 6px; z-index: 10;"></div>
                                ${!isLast ? `<div style="width: 2px; background-color: #e2e8f0; position: absolute; top: 26px; bottom: -20px; z-index: 0;"></div>` : ''}
                            </div>
                            <div style="flex: 1; background-color: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); text-align: ${isAr ? 'right' : 'left'};">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-direction: ${flexDir};">
                                    <h4 style="margin: 0; font-size: 18px; font-weight: bold; color: #0f172a; word-break: break-word;">${item.title || t('session')}</h4>
                                    <div style="font-size: 14px; font-weight: bold; color: #475569; background-color: #f8fafc; border: 1px solid #f1f5f9; padding: 4px 8px; border-radius: 6px; text-align: center; flex-shrink: 0; margin: 0 8px; direction: ltr;">
                                        ${item._calculatedStart} - ${item._calculatedEnd} <br>
                                        <span style="font-size: 12px; font-weight: normal; color: #94a3b8;">(${item.duration}m)</span>
                                    </div>
                                </div>
                                ${item.desc ? `<p style="margin: 0; font-size: 14px; color: #475569; white-space: pre-wrap; word-break: break-word;">${item.desc}</p>` : ''}
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            });
            html += `</div>`;

            executePDFExport(html, filename);
        };

        // --- Initialize ---
        document.addEventListener('DOMContentLoaded', () => {
            document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
            renderApp();
        });
    </script>
</body>
</html>
