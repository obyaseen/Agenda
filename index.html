<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Agenda Builder | منشئ جدول الأعمال</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- html2pdf for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        secondary: '#0ea5e9', // Sky 500
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --font-en: 'Inter', sans-serif;
            --font-ar: 'Cairo', sans-serif;
        }

        body[dir="ltr"] { font-family: var(--font-en); }
        body[dir="rtl"] { font-family: var(--font-ar); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .drag-handle { cursor: grab; touch-action: none; }
        .drag-handle:active { cursor: grabbing; }
        .sortable-ghost { opacity: 0.4; background-color: #f8fafc; border: 2px dashed #cbd5e1; transform: scale(0.98); }
        .sortable-drag { cursor: grabbing !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* Mobile Input Improvements */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        button, select { touch-action: manipulation; }

        /* Custom Color Picker Styling */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            padding: 0;
            background: transparent;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #e2e8f0; border-radius: 6px; }

        /* Print Styles - Hides UI when pressing Ctrl+P natively */
        @media print {
            header, .no-print, #toast, #export-overlay { display: none !important; }
            body { background: white !important; }
            main { padding: 0 !important; max-width: 100% !important; }
            .bg-slate-50 { background-color: white !important; }
            .shadow-sm, .shadow-md, .shadow-inner { box-shadow: none !important; border: 1px solid #e2e8f0; }
        }

        /* Explicit page break helpers for html2pdf Engine */
        .page-break-avoid { 
            page-break-inside: avoid !important; 
            break-inside: avoid !important; 
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 selection:bg-primary selection:text-white transition-all duration-300 relative">

    <div id="app"></div>

    <!-- EXPORT OVERLAY (Loading State Only) -->
    <div id="export-overlay" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[9999] hidden flex-col items-center justify-center p-4 transition-opacity">
        <div class="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center text-center max-w-md w-full border-2 border-indigo-100">
            <i data-lucide="loader-2" class="w-12 h-12 text-primary animate-spin mb-4"></i>
            <h2 class="text-xl md:text-2xl font-bold text-slate-800">Generating PDF...</h2>
            <p class="text-slate-500 text-sm mt-2">Processing page breaks and optimizing layout.</p>
        </div>
    </div>

    <!-- HIDDEN PDF RENDER CONTAINER (Isolated to prevent squashing and scroll issues) -->
    <div style="position: absolute; top: 0; left: -9999px; z-index: 0;">
        <div id="pdf-render-container" class="bg-white pointer-events-none" style="width: 800px;"></div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 end-4 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-50 pointer-events-none">
        <i data-lucide="info" class="w-5 h-5 text-secondary"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <script>
        // --- 1. Utilities & Translations ---
        const escapeHTML = (str) => {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        const timeToMins = (time) => {
            if (!time) return 0;
            const [h, m] = time.split(':').map(Number);
            return (h * 60) + m;
        };

        const minsToTime = (mins) => {
            const h = Math.floor(mins / 60).toString().padStart(2, '0');
            const m = Math.floor(mins % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        };

        const dict = {
            en: {
                appTitle: "Enter title",
                import: "Import",
                exportJson: "Save JSON",
                exportSyllabus: "Syllabus PDF",
                exportTimeline: "Timeline PDF",
                tabBuilder: "Agenda Builder",
                tabTimeline: "Timeline View",
                addDay: "Add Day",
                clearAll: "Start Fresh",
                madeBy: "Made by",
                day: "Day",
                startTime: "Start Time",
                endTime: "End Time",
                scheduleMode: "Schedule Mode",
                modeManual: "Manual End Time",
                modeAutoEnd: "Auto-calculate End",
                modeAutoStretch: "Auto-stretch Sessions",
                goals: "Training Goals",
                outcomes: "Expected Outcomes",
                goalsPlaceholder: "What are the main objectives of this training?",
                outcomesPlaceholder: "What will participants achieve?",
                addSession: "Session",
                addBreak: "Break",
                session: "Session",
                itemsSummary: "sessions & breaks",
                break: "Break",
                logistic: "Logistic",
                titlePlaceholder: "Session Title",
                descPlaceholder: "Add description...",
                duration: "Duration",
                color: "Color",
                to: "to",
                deleteConfirm: "Are you sure you want to delete this day?",
                clearConfirm: "Are you sure you want to clear all data? This cannot be undone.",
                imported: "Data imported successfully.",
                exported: "File exported.",
                dragDropEmpty: "Drag items here or add new ones"
            },
            ar: {
                appTitle: "ادخل العنوان",
                import: "استيراد",
                exportJson: "حفظ JSON",
                exportSyllabus: "PDF المنهج",
                exportTimeline: "PDF المخطط",
                tabBuilder: "باني الجدول",
                tabTimeline: "العرض الزمني",
                addDay: "إضافة يوم",
                clearAll: "مسح الكل",
                madeBy: "تطوير",
                day: "يوم",
                startTime: "وقت البدء",
                endTime: "وقت الانتهاء",
                scheduleMode: "نظام الوقت",
                modeManual: "نهاية يدوية",
                modeAutoEnd: "حساب النهاية تلقائياً",
                modeAutoStretch: "تمديد الجلسات للضبط",
                goals: "أهداف التدريب",
                outcomes: "النتائج المتوقعة",
                goalsPlaceholder: "ما هي الأهداف الرئيسية لهذا التدريب؟",
                outcomesPlaceholder: "ماذا سيحقق المشاركون؟",
                addSession: "جلسة",
                addBreak: "استراحة",
                session: "جلسة",
                itemsSummary: "جلسات واستراحات",
                break: "استراحة",
                logistic: "لوجستي",
                titlePlaceholder: "عنوان الجلسة",
                descPlaceholder: "إضافة وصف...",
                duration: "المدة",
                color: "اللون",
                to: "إلى",
                deleteConfirm: "هل أنت متأكد من حذف هذا اليوم؟",
                clearConfirm: "هل أنت متأكد من مسح جميع البيانات؟ لا يمكن التراجع عن هذا.",
                imported: "تم استيراد البيانات بنجاح.",
                exported: "تم تصدير الملف.",
                dragDropEmpty: "اسحب العناصر هنا أو أضف عناصر جديدة"
            }
        };

        const t = (key) => dict[state.lang][key];
        const defaultColors = { session: '#4f46e5', break: '#f59e0b', logistic: '#64748b' };

        const showToast = (message) => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        };

        // --- 2. State Management ---
        let state = {
            lang: 'en',
            tab: 'builder',
            title: "",
            goals: "",
            outcomes: "",
            days: []
        };
        let sortableInstances = [];

        // --- 3. Core Logic (Time Calculation) ---
        const recalculateTimings = () => {
            state.days.forEach(day => {
                let startMins = timeToMins(day.startTime);
                let currentMins = startMins;

                // Handle 'auto-stretch' Mode
                if (day.mode === 'auto-stretch') {
                    let endMins = timeToMins(day.endTime);
                    if (startMins < endMins) {
                        const totalAvailableMins = endMins - startMins;
                        const fixedItems = day.items.filter(i => i.type !== 'session');
                        const flexItems = day.items.filter(i => i.type === 'session');
                        
                        const fixedMins = fixedItems.reduce((sum, i) => sum + (Number(i.duration) || 0), 0);
                        const remainingMins = Math.max(0, totalAvailableMins - fixedMins);
                        
                        const flexDuration = flexItems.length > 0 ? Math.floor(remainingMins / flexItems.length) : 0;
                        flexItems.forEach(i => i.duration = flexDuration);
                        if (flexItems.length > 0 && remainingMins % flexItems.length !== 0) {
                            flexItems[flexItems.length - 1].duration += (remainingMins % flexItems.length);
                        }
                    }
                }

                // Calculate item start and end times
                day.items.forEach(item => {
                    item._calculatedStart = minsToTime(currentMins);
                    currentMins += Number(item.duration) || 0;
                    item._calculatedEnd = minsToTime(currentMins);
                });

                // Handle 'auto-end' Mode
                if (day.mode === 'auto-end') {
                    day.endTime = minsToTime(currentMins);
                }

                day._totalDuration = currentMins - startMins;
            });
        };

        // --- 4. Render Engine ---
        const toggleLang = () => {
            state.lang = state.lang === 'en' ? 'ar' : 'en';
            document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
            renderApp();
        };

        const renderApp = () => {
            recalculateTimings();
            const app = document.getElementById('app');
            app.innerHTML = `
                <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm print:hidden">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 lg:py-4 flex flex-col lg:flex-row justify-between items-center gap-4">
                        <!-- Title -->
                        <div class="flex flex-col w-full lg:w-auto">
                            <div class="flex items-center gap-3">
                                <div class="bg-primary p-2 md:p-3 rounded-lg text-white shrink-0 shadow-sm">
                                    <i data-lucide="calendar-clock" class="w-5 h-5 md:w-6 md:h-6"></i>
                                </div>
                                <input type="text" id="project-title" value="${escapeHTML(state.title)}" class="text-lg md:text-2xl font-bold text-slate-800 bg-transparent border-b-2 border-transparent hover:border-slate-300 focus:border-primary focus:outline-none transition-colors w-full lg:w-80 min-w-0 placeholder-slate-400" placeholder="${t('appTitle')}">
                            </div>
                            <div class="flex items-center gap-1.5 text-xs text-slate-500 mt-1.5 ms-12 md:ms-14">
                                <span class="font-medium">${t('madeBy')}</span>
                                <a href="https://www.linkedin.com/in/omaryaseen?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 text-primary hover:text-indigo-800 hover:bg-indigo-50 transition-colors px-1.5 py-0.5 rounded font-bold">
                                    <i data-lucide="linkedin" class="w-3 h-3"></i> Omar Yaseen
                                </a>
                            </div>
                        </div>
                        
                        <!-- Toolbars -->
                        <div class="flex flex-wrap items-center gap-2 text-sm justify-center w-full lg:w-auto">
                            <button onclick="toggleLang()" class="px-3 md:px-4 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-md font-medium border border-slate-200 transition-colors shadow-sm">${state.lang === 'en' ? 'عربي' : 'English'}</button>
                            <div class="h-6 w-px bg-slate-300 mx-1 hidden md:block"></div>
                            <input type="file" id="import-file" accept=".json" class="hidden" onchange="importJSON(event)">
                            <button onclick="document.getElementById('import-file').click()" class="flex items-center gap-2 px-3 py-2 text-slate-600 bg-white hover:bg-slate-50 rounded-md transition-colors border border-slate-200 shadow-sm" title="${t('import')}">
                                <i data-lucide="upload" class="w-4 h-4"></i> <span class="hidden sm:inline">${t('import')}</span>
                            </button>
                            <button onclick="exportJSON()" class="flex items-center gap-2 px-3 py-2 text-slate-600 bg-white hover:bg-slate-50 rounded-md transition-colors border border-slate-200 shadow-sm" title="${t('exportJson')}">
                                <i data-lucide="download" class="w-4 h-4"></i> <span class="hidden sm:inline">${t('exportJson')}</span>
                            </button>
                            <div class="h-6 w-px bg-slate-300 mx-1 hidden lg:block"></div>
                            <button onclick="exportSyllabusPDF()" id="btn-export-syllabus" class="flex-1 sm:flex-none justify-center items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md shadow-sm transition-colors font-medium flex">
                                <i data-lucide="file-text" class="w-4 h-4"></i> <span>${t('exportSyllabus')}</span>
                            </button>
                            <button onclick="exportTimelinePDF()" id="btn-export-timeline" class="flex-1 sm:flex-none justify-center items-center gap-2 px-4 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-md shadow-sm transition-colors font-medium flex">
                                <i data-lucide="presentation" class="w-4 h-4"></i> <span>${t('exportTimeline')}</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-6 mt-1 overflow-x-auto whitespace-nowrap hide-scroll">
                        <button onclick="switchTab('builder')" class="py-3 px-1 border-b-2 font-medium text-sm transition-colors ${state.tab === 'builder' ? 'border-primary text-primary' : 'border-transparent text-slate-500 hover:text-slate-700'}">
                            <div class="flex items-center gap-2"><i data-lucide="layout-list" class="w-4 h-4"></i> ${t('tabBuilder')}</div>
                        </button>
                        <button onclick="switchTab('timeline')" class="py-3 px-1 border-b-2 font-medium text-sm transition-colors ${state.tab === 'timeline' ? 'border-primary text-primary' : 'border-transparent text-slate-500 hover:text-slate-700'}">
                            <div class="flex items-center gap-2"><i data-lucide="split-square-vertical" class="w-4 h-4"></i> ${t('tabTimeline')}</div>
                        </button>
                    </div>
                </header>
                <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8">
                    ${state.tab === 'builder' ? renderBuilder() : renderTimelineScreen()}
                </main>
            `;
            lucide.createIcons();
            if (state.tab === 'builder') initSortables();
        };

        const switchTab = (tab) => {
            state.tab = tab;
            renderApp();
        };

        const renderBuilder = () => {
            return `
                <!-- Goals & Outcomes Section -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">${t('goals')}</label>
                            <textarea id="project-goals" class="w-full bg-slate-50 border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary resize-y min-h-[80px]" placeholder="${t('goalsPlaceholder')}">${escapeHTML(state.goals || '')}</textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">${t('outcomes')}</label>
                            <textarea id="project-outcomes" class="w-full bg-slate-50 border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary resize-y min-h-[80px]" placeholder="${t('outcomesPlaceholder')}">${escapeHTML(state.outcomes || '')}</textarea>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <button onclick="clearAllData()" class="flex items-center gap-2 px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-md transition-colors font-semibold text-sm border border-red-100 shadow-sm">
                        <i data-lucide="trash" class="w-4 h-4"></i> <span class="hidden sm:inline">${t('clearAll')}</span>
                    </button>
                    <button onclick="addDay()" class="flex items-center gap-2 px-5 py-2.5 bg-primary hover:bg-indigo-700 text-white rounded-md shadow-sm transition-all hover:-translate-y-0.5 font-bold text-sm">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> ${t('addDay')}
                    </button>
                </div>
                ${state.days.length === 0 ? `
                    <div class="w-full py-16 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-2xl bg-white/50">
                        <i data-lucide="calendar-plus" class="w-16 h-16 mb-4 text-slate-300"></i>
                        <p class="text-lg font-medium text-slate-500">Your agenda is empty.</p>
                        <p class="text-sm">Click "Add Day" to get started.</p>
                    </div>
                ` : `
                    <div id="days-container" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6 items-start">
                        ${state.days.map((day, index) => renderDay(day, index)).join('')}
                    </div>
                `}
            `;
        };

        const renderDay = (day, index) => {
            const isCollapsed = day.isCollapsed;
            const isAutoEnd = day.mode === 'auto-end';
            
            return `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border border-slate-200 overflow-hidden flex flex-col h-full ${!isCollapsed ? 'max-h-[85vh]' : ''}">
                    <!-- Day Header -->
                    <div class="bg-slate-50 p-4 border-b border-slate-200 sticky top-0 z-10 transition-colors ${isCollapsed ? 'hover:bg-slate-100' : ''}">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="bg-primary/10 text-primary text-xs font-bold px-2 py-1 rounded whitespace-nowrap cursor-pointer select-none" onclick="toggleCollapseDay('${day.id}')">${t('day')} ${index + 1}</span>
                                    <input type="text" class="font-bold text-lg md:text-xl text-slate-800 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-primary focus:outline-none w-full min-w-0 day-title-input" value="${escapeHTML(day.title)}" data-day-id="${day.id}">
                                </div>
                            </div>
                            <div class="flex items-center">
                                <button class="text-slate-400 hover:text-primary p-2 transition-colors rounded-full hover:bg-indigo-50" onclick="toggleCollapseDay('${day.id}')">
                                    <i data-lucide="${isCollapsed ? 'chevron-down' : 'chevron-up'}" class="w-5 h-5"></i>
                                </button>
                                <button class="text-slate-400 hover:text-red-500 p-2 transition-colors rounded-full hover:bg-red-50" onclick="deleteDay('${day.id}')">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 bg-white p-3 rounded-lg border border-slate-200 text-sm shadow-sm">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-400 mb-1 uppercase tracking-wider">${t('startTime')}</label>
                                <input type="time" class="w-full bg-slate-50 border border-slate-200 rounded-md px-2 py-1.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary day-start-input" value="${day.startTime}" data-day-id="${day.id}">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-400 mb-1 uppercase tracking-wider">${t('endTime')} ${isAutoEnd ? '(Auto)' : ''}</label>
                                <input type="time" class="w-full bg-slate-50 border border-slate-200 rounded-md px-2 py-1.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary day-end-input" value="${day.endTime}" data-day-id="${day.id}" ${isAutoEnd ? 'readonly disabled class="opacity-60"' : ''}>
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[11px] font-bold text-slate-400 mb-1 uppercase tracking-wider">${t('scheduleMode')}</label>
                                <select class="w-full bg-slate-50 border border-slate-200 rounded-md px-2 py-1.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary day-mode-select text-xs font-semibold text-slate-600 cursor-pointer" data-day-id="${day.id}">
                                    <option value="manual" ${day.mode === 'manual' ? 'selected' : ''}>${t('modeManual')}</option>
                                    <option value="auto-end" ${day.mode === 'auto-end' ? 'selected' : ''}>${t('modeAutoEnd')}</option>
                                    <option value="auto-stretch" ${day.mode === 'auto-stretch' ? 'selected' : ''}>${t('modeAutoStretch')}</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    ${!isCollapsed ? `
                        <!-- Expanded View -->
                        <div class="p-3 md:p-4 flex-1 overflow-y-auto sortable-list min-h-[150px]" data-day-id="${day.id}">
                            ${day.items.length === 0 ? `<div class="p-8 text-center text-slate-400 text-sm border-2 border-dashed border-slate-200 rounded-lg flex items-center justify-center h-full bg-slate-50/50">${t('dragDropEmpty')}</div>` : day.items.map(item => renderItem(day, item)).join('')}
                        </div>
                        <div class="p-3 md:p-4 border-t border-slate-100 bg-slate-50 flex gap-2 sm:gap-3">
                            <button onclick="addItem('${day.id}', 'session')" class="flex-1 flex justify-center items-center gap-1.5 py-2.5 bg-white border border-slate-200 hover:border-primary hover:text-primary rounded-md text-sm font-bold text-slate-600 transition-colors shadow-sm"><i data-lucide="plus" class="w-4 h-4"></i> ${t('addSession')}</button>
                            <button onclick="addItem('${day.id}', 'break')" class="flex-1 flex justify-center items-center gap-1.5 py-2.5 bg-white border border-slate-200 hover:border-amber-500 hover:text-amber-600 rounded-md text-sm font-bold text-slate-600 transition-colors shadow-sm"><i data-lucide="coffee" class="w-4 h-4"></i> ${t('addBreak')}</button>
                        </div>
                    ` : `
                        <!-- Collapsed View Summary -->
                        <div class="p-4 bg-slate-50 border-t border-slate-100 flex justify-between items-center cursor-pointer hover:bg-slate-100 transition-colors" onclick="toggleCollapseDay('${day.id}')">
                            <span class="text-sm font-semibold text-slate-500">${day.items.length} ${t('itemsSummary')}</span>
                            <span class="text-xs font-bold text-slate-400 bg-white px-2 py-1 rounded border border-slate-200 shadow-sm" dir="ltr">${day.startTime} - ${day.endTime}</span>
                        </div>
                    `}
                </div>
            `;
        };

        const renderItem = (day, item) => {
            const isStretch = day.mode === 'auto-stretch' && item.type === 'session';
            const currentColor = item.color || defaultColors[item.type];
            return `
                <div class="group relative bg-white border border-slate-200 rounded-lg shadow-sm hover:shadow-md transition-all mb-3 overflow-hidden border-s-4" style="border-inline-start-color: ${currentColor}" data-item-id="${item.id}">
                    <div class="p-2 md:p-3 flex items-start gap-1.5 md:gap-2">
                        <div class="drag-handle mt-1 text-slate-300 hover:text-slate-500 p-1 md:p-1.5 shrink-0 rounded hover:bg-slate-50 active:bg-slate-100"><i data-lucide="grip-vertical" class="w-5 h-5"></i></div>
                        <div class="flex flex-col items-center justify-center min-w-[55px] md:min-w-[65px] mt-1 shrink-0 bg-slate-50 rounded py-1 px-1.5 md:px-2 border border-slate-100">
                            <span class="text-xs font-bold text-slate-700">${item._calculatedStart}</span>
                            <span class="text-[10px] text-slate-400 my-0.5">${t('to')}</span>
                            <span class="text-xs font-bold text-slate-600">${item._calculatedEnd}</span>
                        </div>
                        <div class="flex-1 min-w-0 ms-1 flex flex-col gap-1.5">
                            <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                                <input type="text" class="font-bold text-slate-800 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-primary focus:outline-none flex-1 min-w-0 text-sm md:text-base py-0.5 item-title-input" value="${escapeHTML(item.title)}" placeholder="${t('titlePlaceholder')}" data-day-id="${day.id}" data-item-id="${item.id}">
                                
                                <div class="flex items-center gap-1.5 bg-slate-50 px-2 py-1 rounded border border-slate-200 shrink-0 w-fit">
                                    <input type="color" value="${currentColor}" class="item-color-input w-5 h-5 md:w-6 md:h-6 rounded cursor-pointer shrink-0 shadow-sm" data-day-id="${day.id}" data-item-id="${item.id}" title="${t('color')}">
                                    <div class="w-px h-4 bg-slate-300"></div>
                                    <select class="text-xs md:text-sm bg-transparent text-slate-600 focus:outline-none focus:text-primary item-type-select font-medium cursor-pointer py-1" data-day-id="${day.id}" data-item-id="${item.id}">
                                        <option value="session" ${item.type === 'session' ? 'selected' : ''}>${t('session')}</option>
                                        <option value="break" ${item.type === 'break' ? 'selected' : ''}>${t('break')}</option>
                                        <option value="logistic" ${item.type === 'logistic' ? 'selected' : ''}>${t('logistic')}</option>
                                    </select>
                                </div>
                            </div>
                            <textarea class="text-xs md:text-sm text-slate-500 bg-transparent border border-transparent hover:border-slate-200 focus:border-primary rounded p-1.5 focus:outline-none w-full resize-none item-desc-input" rows="1" placeholder="${t('descPlaceholder')}" data-day-id="${day.id}" data-item-id="${item.id}">${escapeHTML(item.desc)}</textarea>
                        </div>
                        <div class="flex flex-col items-end justify-between h-full shrink-0 ms-1 gap-2">
                            <div class="flex items-center bg-slate-50 border border-slate-200 rounded overflow-hidden ${isStretch ? 'opacity-60' : ''}" title="${isStretch ? 'Calculated automatically' : t('duration')}">
                                <input type="number" class="w-10 md:w-12 text-center py-1.5 md:py-1 text-xs font-semibold focus:outline-none focus:bg-white item-duration-input" value="${item.duration}" min="0" data-day-id="${day.id}" data-item-id="${item.id}" ${isStretch ? 'readonly tabindex="-1"' : ''}>
                                <span class="px-1.5 text-[10px] font-medium text-slate-500 bg-slate-100 border-s border-slate-200 py-2 md:py-1.5">m</span>
                            </div>
                            <button onclick="deleteItem('${day.id}', '${item.id}')" class="text-slate-300 hover:text-red-500 transition-colors p-2 rounded hover:bg-red-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderTimelineScreen = () => {
            let headerInfo = '';
            if (state.goals || state.outcomes) {
                headerInfo = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 md:mb-12 text-start">`;
                if (state.goals) {
                    headerInfo += `<div class="bg-slate-50 rounded-lg p-4 border border-slate-100"><h3 class="font-bold text-slate-700 mb-2">${t('goals')}</h3><p class="text-sm text-slate-600 whitespace-pre-wrap word-break break-words">${escapeHTML(state.goals)}</p></div>`;
                }
                if (state.outcomes) {
                    headerInfo += `<div class="bg-slate-50 rounded-lg p-4 border border-slate-100"><h3 class="font-bold text-slate-700 mb-2">${t('outcomes')}</h3><p class="text-sm text-slate-600 whitespace-pre-wrap word-break break-words">${escapeHTML(state.outcomes)}</p></div>`;
                }
                headerInfo += `</div>`;
            }

            const daysHTML = state.days.length > 0 ? state.days.map((day, index) => {
                const dayBoundsMins = timeToMins(day.endTime) - timeToMins(day.startTime);
                const barTotalMins = Math.max(day._totalDuration, dayBoundsMins, 1);
                
                const barBlocks = day.items.map(item => {
                    const widthPercent = (item.duration / barTotalMins) * 100;
                    return `<div class="h-full border-e border-white/30 last:border-0 hover:opacity-80 transition-opacity" style="width: ${widthPercent}%; background-color: ${item.color || defaultColors[item.type]};" title="${escapeHTML(item.title)}"></div>`;
                }).join('');

                const listItems = day.items.map((item, idx) => {
                    const color = item.color || defaultColors[item.type];
                    const isLast = idx === day.items.length - 1;
                    return `
                        <div class="relative flex items-stretch gap-3 md:gap-4 mb-4 group">
                            <div class="relative flex flex-col items-center w-6 shrink-0">
                                <div class="w-3.5 h-3.5 md:w-4 md:h-4 rounded-full mt-2 z-10 transition-transform group-hover:scale-125" style="background-color: ${color}; outline: 3px solid white; box-shadow: 0 0 0 4px ${color}20;"></div>
                                ${!isLast ? `<div class="w-0.5 bg-slate-200 absolute top-7 bottom-[-24px] z-0 transition-colors group-hover:bg-slate-300"></div>` : ''}
                            </div>
                            <div class="flex-1 bg-white border border-slate-100 rounded-lg p-3 md:p-4 shadow-sm hover:shadow-md transition-all min-w-0 group-hover:border-slate-200">
                                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-2 mb-2">
                                    <h4 class="font-bold text-slate-800 text-base md:text-lg break-words leading-tight">${escapeHTML(item.title) || t('session')}</h4>
                                    <span class="text-xs md:text-sm font-bold text-slate-600 bg-slate-50 border border-slate-100 px-2 py-1 md:px-3 md:py-1 rounded-md shrink-0 text-center shadow-sm" dir="ltr">
                                        ${item._calculatedStart} - ${item._calculatedEnd}<br>
                                        <span class="text-[10px] md:text-xs font-normal text-slate-400">(${item.duration}m)</span>
                                    </span>
                                </div>
                                ${item.desc ? `<p class="text-slate-500 text-xs md:text-sm whitespace-pre-wrap break-words leading-relaxed">${escapeHTML(item.desc)}</p>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="mb-10 md:mb-14">
                        <div class="flex flex-wrap items-center gap-2 md:gap-3 border-b-2 border-slate-100 pb-3 md:pb-4 mb-4 md:mb-6">
                            <span class="bg-primary text-white px-2 py-1 md:px-3 rounded-md text-xs md:text-sm font-bold shadow-sm">${t('day')} ${index + 1}</span>
                            <h3 class="text-lg md:text-xl font-bold text-slate-800 break-words">${escapeHTML(day.title)}</h3>
                            <span class="text-xs md:text-sm font-semibold text-slate-400 ms-auto bg-slate-50 px-2 md:px-3 py-1 rounded-full border border-slate-200 shadow-sm" dir="ltr">${day.startTime} - ${day.endTime}</span>
                        </div>
                        <div class="w-full h-4 sm:h-5 md:h-6 bg-slate-100 rounded-full overflow-hidden flex shadow-inner mb-6 md:mb-8 border border-slate-200">
                            ${day.items.length > 0 ? barBlocks : `<div class="w-full h-full flex items-center justify-center text-slate-400 text-[10px]">...</div>`}
                        </div>
                        <div class="relative ms-1 sm:ms-2">${listItems}</div>
                    </div>
                `;
            }).join('') : `<div class="w-full py-12 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-2xl bg-white/50"><i data-lucide="split-square-vertical" class="w-12 h-12 mb-4 text-slate-300"></i><p>${t('dragDropEmpty')}</p></div>`;

            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 md:p-10 max-w-4xl mx-auto">
                    <div class="text-center mb-8 md:mb-12 border-b-2 border-slate-100 pb-6 md:pb-8">
                        <h2 class="text-2xl md:text-4xl font-bold text-slate-800 mb-3 break-words">${escapeHTML(state.title) || t('appTitle')}</h2>
                    </div>
                    ${headerInfo}
                    <div>${daysHTML}</div>
                </div>
            `;
        };

        // --- 5. Event Listeners & Global Setup ---
        const initSortables = () => {
            sortableInstances.forEach(s => s.destroy()); sortableInstances = [];
            document.querySelectorAll('.sortable-list').forEach(listEl => {
                const sortable = Sortable.create(listEl, {
                    group: 'agenda-items', 
                    animation: 250, 
                    easing: "cubic-bezier(1, 0, 0, 1)",
                    handle: '.drag-handle',
                    ghostClass: 'sortable-ghost', 
                    dragClass: 'sortable-drag',
                    delay: 150, 
                    delayOnTouchOnly: true,
                    touchStartThreshold: 5,
                    onEnd: function (evt) {
                        const item = state.days.find(d => d.id === evt.from.dataset.dayId).items.splice(evt.oldIndex, 1)[0];
                        state.days.find(d => d.id === evt.to.dataset.dayId).items.splice(evt.newIndex, 0, item);
                        renderApp();
                    }
                });
                sortableInstances.push(sortable);
            });
        };

        const setupGlobalEventListeners = () => {
            const app = document.getElementById('app');

            app.addEventListener('input', (e) => {
                const target = e.target;
                
                if (target.id === 'project-title') { state.title = target.value; return; }
                if (target.id === 'project-goals') { 
                    state.goals = target.value; 
                    target.style.height = 'auto'; 
                    target.style.height = (target.scrollHeight) + 'px';
                    return; 
                }
                if (target.id === 'project-outcomes') { 
                    state.outcomes = target.value; 
                    target.style.height = 'auto'; 
                    target.style.height = (target.scrollHeight) + 'px';
                    return; 
                }

                if (!target.dataset.dayId) return;
                const day = state.days.find(d => d.id === target.dataset.dayId);
                if (!day) return;

                const item = target.dataset.itemId ? day.items.find(i => i.id === target.dataset.itemId) : null;

                if (target.classList.contains('day-title-input')) {
                    day.title = target.value;
                } else if (item) {
                    if (target.classList.contains('item-title-input')) {
                        item.title = target.value;
                    } else if (target.classList.contains('item-desc-input')) {
                        item.desc = target.value;
                        target.style.height = 'auto'; 
                        target.style.height = (target.scrollHeight) + 'px';
                    }
                }
            });

            app.addEventListener('change', (e) => {
                const target = e.target;
                let needsRender = false;

                if (!target.dataset.dayId) return;
                
                const day = state.days.find(d => d.id === target.dataset.dayId);
                if (!day) return;
                
                const item = target.dataset.itemId ? day.items.find(i => i.id === target.dataset.itemId) : null;

                if (target.classList.contains('day-start-input')) { day.startTime = target.value; needsRender = true; }
                if (target.classList.contains('day-end-input')) { day.endTime = target.value; needsRender = true; }
                if (target.classList.contains('day-mode-select')) { day.mode = target.value; needsRender = true; }
                
                if (item) {
                    if (target.classList.contains('item-duration-input')) { 
                        item.duration = parseInt(target.value) || 0; 
                        needsRender = true; 
                    }
                    if (target.classList.contains('item-color-input')) { 
                        item.color = target.value; 
                        needsRender = true; 
                    }
                    if (target.classList.contains('item-type-select')) { 
                        item.type = target.value; 
                        item.color = defaultColors[item.type]; 
                        needsRender = true; 
                    }
                }
                
                if (needsRender) renderApp();
            });
        };

        // UI Action Handlers
        const addDay = () => { 
            state.days.push({ 
                id: generateId(), 
                title: `${t('day')} ${state.days.length + 1}`, 
                startTime: "09:00", 
                endTime: "16:00", 
                mode: 'manual',
                isCollapsed: false, 
                items: [] 
            }); 
            renderApp(); 
        };
        
        const deleteDay = (id) => { if(confirm(t('deleteConfirm'))) { state.days = state.days.filter(d => d.id !== id); renderApp(); } };
        const toggleCollapseDay = (id) => { const day = state.days.find(d => d.id === id); if(day) { day.isCollapsed = !day.isCollapsed; renderApp(); } };
        
        const clearAllData = () => { 
            if(confirm(t('clearConfirm'))) { 
                state.days = []; 
                state.title = ""; 
                state.goals = "";
                state.outcomes = "";
                renderApp(); 
            } 
        };
        
        const addItem = (dayId, type) => { state.days.find(d => d.id === dayId).items.push({ id: generateId(), title: type === 'session' ? t('session') : t('break'), type: type, duration: type === 'session' ? 60 : 15, desc: "", color: defaultColors[type] }); renderApp(); };
        const deleteItem = (dayId, itemId) => { const day = state.days.find(d => d.id === dayId); day.items = day.items.filter(i => i.id !== itemId); renderApp(); };

        // Export/Import JSON 
        const exportJSON = () => {
            const exportState = JSON.parse(JSON.stringify(state));
            exportState.days.forEach(d => {
                delete d._totalDuration;
                d.items.forEach(i => { delete i._calculatedStart; delete i._calculatedEnd; });
            });
            
            const dataStr = JSON.stringify(exportState, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; 
            const safeTitle = state.title ? '_' + state.title.replace(/\s+/g, '_') : '';
            a.download = `Agenda${safeTitle}.json`; 
            a.click();
            URL.revokeObjectURL(url); showToast(t('exported'));
        };

        const importJSON = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try { 
                    const data = JSON.parse(event.target.result); 
                    if(data.days) { 
                        data.days.forEach(d => { 
                            if(d.isCollapsed === undefined) d.isCollapsed = false; 
                            if(d.mode === undefined) d.mode = d.autoAdjust ? 'auto-stretch' : 'auto-end';
                        });
                        state = data; 
                        renderApp(); 
                        showToast(t('imported')); 
                    } 
                } 
                catch (err) { alert("Invalid JSON format."); }
            };
            reader.readAsText(file); e.target.value = '';
        };

        // --- 7. MULTI-PAGE & ARABIC-OPTIMIZED PDF EXPORT ENGINE ---
        
        const setButtonLoading = (btnId, isLoading) => {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            if (isLoading) {
                btn.dataset.originalHtml = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> <span>Processing...</span>`;
                btn.disabled = true;
                btn.classList.add('opacity-75');
            } else {
                btn.innerHTML = btn.dataset.originalHtml;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
            lucide.createIcons();
        };

        const executePDFExport = (htmlContent, filename, btnId) => {
            const overlay = document.getElementById('export-overlay');
            const container = document.getElementById('pdf-render-container');
            
            const isAr = state.lang === 'ar';
            container.setAttribute('dir', isAr ? 'rtl' : 'ltr');
            container.innerHTML = htmlContent;
            
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            window.scrollTo(0, 0);

            setTimeout(() => {
                const opt = {
                    margin: 0.5, 
                    filename: filename,
                    image: { type: 'jpeg', quality: 1 },
                    html2canvas: { 
                        scale: 2, 
                        useCORS: true, 
                        logging: false,
                        scrollY: 0, 
                        windowWidth: 800
                    }, 
                    jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: ['css', 'legacy'], avoid: '.page-break-avoid' }
                };
                
                html2pdf().set(opt).from(container).save().then(() => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    container.innerHTML = '';
                    if (btnId) setButtonLoading(btnId, false);
                }).catch(err => {
                    console.error("PDF error: ", err);
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    container.innerHTML = '';
                    if (btnId) setButtonLoading(btnId, false);
                    alert("Error generating PDF. Please try again.");
                });
            }, 500); 
        };

        // Shared Inline styles 
        const getPDFInlineStyles = (isAr) => `
            font-family: ${isAr ? "'Cairo', sans-serif" : "'Inter', sans-serif"}; 
            color: #1e293b; 
            background: #ffffff;
            line-height: 1.5;
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            text-align: ${isAr ? 'right' : 'left'};
        `;

        const exportSyllabusPDF = () => {
            const btnId = 'btn-export-syllabus';
            setButtonLoading(btnId, true);
            recalculateTimings();
            const isAr = state.lang === 'ar';
            const safeTitle = state.title ? '_' + state.title.replace(/\s+/g, '_') : '';
            const filename = `Agenda${safeTitle}.pdf`;
            const align = isAr ? 'right' : 'left';
            const hasInfo = state.goals || state.outcomes;
            
            let html = `
                <div style="${getPDFInlineStyles(isAr)}" dir="${isAr ? 'rtl' : 'ltr'}">
                    <div style="text-align: center; margin-bottom: ${hasInfo ? '24px' : '40px'}; border-bottom: 2px solid #4f46e5; padding-bottom: 20px;">
                        <h1 style="color: #0f172a; margin: 0; font-size: 28px; font-weight: bold;">${escapeHTML(state.title) || t('appTitle')}</h1>
                    </div>
            `;

            if (hasInfo) {
                html += `<div class="page-break-avoid" style="margin-bottom: 40px; overflow: hidden;">`; 
                if (state.goals) {
                    html += `
                        <div style="float: ${isAr ? 'right' : 'left'}; width: 48%; background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; box-sizing: border-box;">
                            <h3 style="margin-top: 0; margin-bottom: 8px; font-size: 16px; color: #334155;">${t('goals')}</h3>
                            <div style="font-size: 14px; color: #475569; white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word;">${escapeHTML(state.goals)}</div>
                        </div>
                    `;
                }
                if (state.outcomes) {
                    html += `
                        <div style="float: ${isAr ? 'left' : 'right'}; width: 48%; background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; box-sizing: border-box;">
                            <h3 style="margin-top: 0; margin-bottom: 8px; font-size: 16px; color: #334155;">${t('outcomes')}</h3>
                            <div style="font-size: 14px; color: #475569; white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word;">${escapeHTML(state.outcomes)}</div>
                        </div>
                    `;
                }
                html += `<div style="clear: both;"></div></div>`;
            }

            state.days.forEach((day, index) => {
                html += `<div style="margin-bottom: 40px;">`; 
                
                html += `
                    <div class="page-break-avoid" style="border-bottom: 2px solid #cbd5e1; padding-bottom: 8px; margin-bottom: 15px;">
                        <span style="font-size: 14px; color: #64748b; direction: ltr; float: ${isAr ? 'left' : 'right'}; margin-top: 5px;">${day.startTime} - ${day.endTime}</span>
                        <h2 style="color: #4f46e5; margin: 0; font-size: 20px; font-weight: bold; text-align: ${align};">${t('day')} ${index + 1}: ${escapeHTML(day.title)}</h2>
                        <div style="clear:both;"></div>
                    </div>
                `;

                // ADDED table-layout: fixed to enforce cell wrapping
                html += `
                    <div class="page-break-avoid" style="display: table; table-layout: fixed; width: 100%; background-color: #f8fafc; border-bottom: 2px solid #e2e8f0; font-weight: bold; color: #475569; font-size: 14px;">
                        <div style="display: table-cell; width: 120px; padding: 12px; text-align: ${align};">${t('startTime')}</div>
                        <div style="display: table-cell; padding: 12px; text-align: ${align};">Details</div>
                    </div>
                `;

                day.items.forEach(item => {
                    const color = item.color || defaultColors[item.type];
                    const bg = item.type === 'break' ? '#fef9c3' : '#ffffff';
                    const borderSide = isAr ? 'border-right' : 'border-left';
                    
                    // ADDED table-layout: fixed to enforce cell wrapping
                    html += `
                        <div class="page-break-avoid" style="display: table; table-layout: fixed; width: 100%; background-color: ${bg}; border-bottom: 1px solid #e2e8f0; font-size: 14px;">
                            <div style="display: table-cell; width: 120px; padding: 12px; white-space: nowrap; border-${isAr?'right':'left'}: 4px solid ${color}; text-align: ${align}; vertical-align: top; box-sizing: border-box;">
                                <strong style="color: #334155; font-size: 15px; display: block;" dir="ltr">${item._calculatedStart}</strong>
                                <span style="color: #64748b; font-size: 12px; display: block;" dir="ltr">${item.duration}m</span>
                            </div>
                            <div style="display: table-cell; padding: 12px; text-align: ${align}; vertical-align: top; box-sizing: border-box;">
                                <div style="font-weight: bold; color: #0f172a; margin-bottom: 4px; font-size: 16px; overflow-wrap: break-word; word-wrap: break-word;">${escapeHTML(item.title) || 'Untitled'}</div>
                                ${item.desc ? `<div style="color: #475569; white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word;">${escapeHTML(item.desc)}</div>` : ''}
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            });
            html += `</div>`;
            
            executePDFExport(html, filename, btnId);
        };

        const exportTimelinePDF = () => {
            const btnId = 'btn-export-timeline';
            setButtonLoading(btnId, true);
            recalculateTimings();
            const isAr = state.lang === 'ar';
            const safeTitle = state.title ? '_' + state.title.replace(/\s+/g, '_') : '';
            const filename = `Timeline${safeTitle}.pdf`;
            const align = isAr ? 'right' : 'left';
            const hasInfo = state.goals || state.outcomes;

            let html = `
                <div style="${getPDFInlineStyles(isAr)}" dir="${isAr ? 'rtl' : 'ltr'}">
                    <div style="text-align: center; margin-bottom: ${hasInfo ? '24px' : '40px'}; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px;">
                        <h1 style="color: #0f172a; margin: 0; font-size: 28px; font-weight: bold;">${escapeHTML(state.title) || t('appTitle')}</h1>
                    </div>
            `;

            if (hasInfo) {
                html += `<div class="page-break-avoid" style="margin-bottom: 40px; overflow: hidden;">`;
                if (state.goals) {
                    html += `
                        <div style="float: ${isAr ? 'right' : 'left'}; width: 48%; background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; box-sizing: border-box;">
                            <h3 style="margin-top: 0; margin-bottom: 8px; font-size: 16px; color: #334155;">${t('goals')}</h3>
                            <div style="font-size: 14px; color: #475569; white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word;">${escapeHTML(state.goals)}</div>
                        </div>
                    `;
                }
                if (state.outcomes) {
                    html += `
                        <div style="float: ${isAr ? 'left' : 'right'}; width: 48%; background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; box-sizing: border-box;">
                            <h3 style="margin-top: 0; margin-bottom: 8px; font-size: 16px; color: #334155;">${t('outcomes')}</h3>
                            <div style="font-size: 14px; color: #475569; white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word;">${escapeHTML(state.outcomes)}</div>
                        </div>
                    `;
                }
                html += `<div style="clear: both;"></div></div>`;
            }

            state.days.forEach((day, index) => {
                const dayBoundsMins = timeToMins(day.endTime) - timeToMins(day.startTime);
                const barTotalMins = Math.max(day._totalDuration, dayBoundsMins, 1);
                
                html += `<div style="margin-bottom: 40px;">`;
                
                // ADDED table-layout: fixed to enforce wrapping
                html += `
                    <div class="page-break-avoid" style="display: table; table-layout: fixed; width: 100%; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 20px;">
                        <div style="display: table-cell; vertical-align: middle;">
                            <span style="background-color: #4f46e5; color: white; padding: 4px 12px; border-radius: 6px; font-size: 14px; font-weight: bold; margin-${isAr?'left':'right'}: 12px; display: inline-block;">${t('day')} ${index + 1}</span>
                            <span style="margin: 0; font-size: 20px; font-weight: bold; color: #0f172a; display: inline-block; vertical-align: middle;">${escapeHTML(day.title)}</span>
                        </div>
                        <div style="display: table-cell; vertical-align: middle; text-align: ${isAr?'left':'right'}; width: 180px;">
                            <span style="font-size: 14px; color: #64748b; border: 1px solid #e2e8f0; padding: 4px 12px; border-radius: 20px; background-color: #f8fafc; direction: ltr; display: inline-block;">${day.startTime} - ${day.endTime}</span>
                        </div>
                    </div>
                `;

                // Progress Bar
                let blocks = '';
                day.items.forEach(item => {
                    const widthPercent = (item.duration / barTotalMins) * 100;
                    const color = item.color || defaultColors[item.type];
                    blocks += `<div style="float: ${isAr ? 'right' : 'left'}; width: ${widthPercent}%; height: 24px; background-color: ${color}; box-sizing: border-box; border-${isAr?'left':'right'}: 1px solid rgba(255,255,255,0.3);"></div>`;
                });
                
                html += `
                    <div class="page-break-avoid" style="width: 100%; height: 24px; background-color: #f1f5f9; border-radius: 12px; overflow: hidden; margin-bottom: 24px; border: 1px solid #e2e8f0;">
                        ${day.items.length > 0 ? blocks : ''}
                    </div>
                `;

                // Timeline Items
                day.items.forEach((item, idx) => {
                    const color = item.color || defaultColors[item.type];
                    const isLast = idx === day.items.length - 1;
                    const nodeMargin = isAr ? 'margin-left: 16px;' : 'margin-right: 16px;';

                    // ADDED table-layout: fixed to enforce cell wrapping
                    html += `
                        <div class="page-break-avoid" style="display: table; table-layout: fixed; width: 100%; margin-bottom: 16px;">
                            <div style="display: table-cell; width: 32px; position: relative; vertical-align: top; padding-top: 8px; ${nodeMargin}">
                                <div style="width: 16px; height: 16px; border-radius: 50%; background-color: ${color}; border: 3px solid white; box-shadow: 0 0 0 2px #e2e8f0; position: relative; z-index: 10; margin: 0 auto;"></div>
                                ${!isLast ? `<div style="width: 2px; background-color: #e2e8f0; position: absolute; top: 24px; bottom: -20px; left: 50%; transform: translateX(-50%); z-index: 0;"></div>` : ''}
                            </div>
                            <div style="display: table-cell; background-color: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); vertical-align: top;">
                                <div style="display: table; table-layout: fixed; width: 100%; margin-bottom: 8px;">
                                    <div style="display: table-cell; vertical-align: top;">
                                        <h4 style="margin: 0; font-size: 18px; font-weight: bold; color: #0f172a; overflow-wrap: break-word; word-wrap: break-word;">${escapeHTML(item.title) || t('session')}</h4>
                                    </div>
                                    <div style="display: table-cell; width: 130px; text-align: center; vertical-align: top; padding-${isAr?'right':'left'}: 16px;">
                                        <div style="font-size: 14px; font-weight: bold; color: #475569; background-color: #f8fafc; border: 1px solid #f1f5f9; padding: 4px 8px; border-radius: 6px; direction: ltr; display: inline-block;">
                                            ${item._calculatedStart} - ${item._calculatedEnd} <br>
                                            <span style="font-size: 12px; font-weight: normal; color: #94a3b8;">(${item.duration}m)</span>
                                        </div>
                                    </div>
                                </div>
                                ${item.desc ? `<p style="margin: 0; font-size: 14px; color: #475569; white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word;">${escapeHTML(item.desc)}</p>` : ''}
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            });
            html += `</div>`;

            executePDFExport(html, filename, btnId);
        };

        // --- Initialize ---
        document.addEventListener('DOMContentLoaded', () => {
            document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
            setupGlobalEventListeners();
            renderApp();
        });
    </script>
</body>
</html>
